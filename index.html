<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="clay" data-theme-name="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e8dcc0">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>مِسار — رفيقك اليومي</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23a85c3f'/%3E%3Cpath d='M8 12l3 3 5-6' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════
   المتغيرات والثيمات
   ═══════════════════════════════════════════════════ */
:root{
  --md-shape-xs:6px; --md-shape-sm:9px; --md-shape-md:12px;
  --md-shape-lg:16px; --md-shape-xl:20px; --md-shape-xxl:22px;
  --md-shape-full:9999px;
  --md-motion-standard:cubic-bezier(.2,0,0,1);
  --md-duration-short:150ms;
  --md-duration-medium:250ms;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html{
  color-scheme:light;
  --md-seed:#a85c3f;
  --md-primary:var(--md-seed);
  --md-on-primary:#f8efe0;
  --md-surface:                  color-mix(in srgb,var(--md-seed) 15%,#f0e6cd);
  --md-surface-container-lowest: color-mix(in srgb,var(--md-seed) 8%,#f0e6cd);
  --md-surface-container-low:    color-mix(in srgb,var(--md-seed) 20%,#f0e6cd);
  --md-surface-container:        color-mix(in srgb,var(--md-seed) 26%,#e8dcc0);
  --md-surface-container-high:   color-mix(in srgb,var(--md-seed) 32%,#e8dcc0);
  --md-on-surface:         color-mix(in srgb,var(--md-seed) 25%,#1a0f08);
  --md-on-surface-variant: color-mix(in srgb,var(--md-seed) 45%,#4a3828);
  --cc-line:  color-mix(in srgb,var(--md-seed) 22%,#b8a880);
  --cc-ochre: color-mix(in srgb,var(--md-seed) 35%,#b5893f);
  --md-elev-1:0 3px 10px color-mix(in srgb,var(--md-seed) 25%,rgba(61,47,36,.15));
  --md-elev-3:0 10px 30px color-mix(in srgb,var(--md-seed) 30%,rgba(61,47,36,.2));
  --md-error:#a83232; --md-error-container:#ecd0c4; --md-on-error-container:#4a1010;
  --md-success:#2e7d32; --md-success-container:#c8e6c9;
  --md-warning:#b5893f; --md-warning-container:#f0e0c0;
}
html[data-theme="clay"]      {--md-seed:#a85c3f}
html[data-theme="red"]       {--md-seed:#B3261E}
html[data-theme="blue"]      {--md-seed:#1565C0}
html[data-theme="emerald"]   {--md-seed:#146C2E}
html[data-theme="purple"]    {--md-seed:#6750A4}
html[data-theme="gold"]      {--md-seed:#B26A00}
html[data-theme="slate"]     {--md-seed:#4A5560}
html[data-theme="pink"]      {--md-seed:#B3456E}
html[data-theme="teal"]      {--md-seed:#00796B}
html[data-theme="terracotta"]{--md-seed:#B5532B}
html[data-theme="olive"]     {--md-seed:#6B7A1F}
html[data-theme="indigo"]    {--md-seed:#3949AB}
html[data-theme="sepia"]     {--md-seed:#7A5230}
html[data-theme="dark"]{
  color-scheme:dark;
  --md-seed:#a85c3f;
  --md-primary:color-mix(in srgb,var(--md-seed) 85%,#fff);
  --md-on-primary:#2a2118;
  --md-surface:                  color-mix(in srgb,var(--md-seed) 12%,#2a2118);
  --md-surface-container-lowest: color-mix(in srgb,var(--md-seed) 8%,#231b13);
  --md-surface-container-low:    color-mix(in srgb,var(--md-seed) 15%,#2f251b);
  --md-surface-container:        color-mix(in srgb,var(--md-seed) 18%,#352a1f);
  --md-surface-container-high:   color-mix(in srgb,var(--md-seed) 22%,#3f3227);
  --md-on-surface:#e8dcc0;
  --md-on-surface-variant:#d2c39e;
  --cc-line:#5a4838;
  --cc-ochre:color-mix(in srgb,var(--md-seed) 55%,#d4a35a);
  --md-elev-1:0 3px 10px rgba(0,0,0,.35);
  --md-elev-3:0 10px 30px rgba(0,0,0,.55);
  --md-error:#ff8c8c; --md-error-container:#5a2424; --md-on-error-container:#ffd9d9;
  --md-success:#81c784; --md-success-container:#2e5c30;
  --md-warning:#d4a35a; --md-warning-container:#3a2f1f;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html,body{max-width:100%;overflow-x:clip}
@supports not (overflow:clip){html,body{overflow-x:hidden}}
html{scroll-behavior:smooth}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}

body{
  font-family:'Tajawal',system-ui,-apple-system,sans-serif;
  font-size:15px; color:var(--md-on-surface);
  background:var(--md-surface); line-height:1.6;
  display:flex; justify-content:center;
  min-height:100vh; min-height:100dvh;
  transition:background .4s ease,color .4s ease;
  overflow-wrap:break-word;
  -webkit-overflow-scrolling:touch;
}
button{font-family:inherit;cursor:pointer;user-select:none;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit}

/* ═══════ Telegram Mini App ═══════ */
html, body{
  height: var(--tg-viewport-height, 100vh) !important;
  min-height: var(--tg-viewport-height, 100dvh) !important;
}
html.tg-app, body.tg-app{
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.tg-app input, .tg-app textarea{
  user-select: text;
  -webkit-user-select: text;
}

.top-bar{
  position:fixed; top:0; left:0; right:0;
  height:calc(var(--safe-top) + 60px);
  padding-top:var(--safe-top);
  z-index:98;
  pointer-events:none;
  background:color-mix(in srgb, var(--md-surface) 82%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid color-mix(in srgb, var(--cc-line) 55%, transparent);
  transition:background .3s ease, border-color .3s ease;
}
.top-bar[hidden]{display:none}

.screen{
  width:min(440px,100%);
  min-height:100vh; min-height:100dvh;
  padding:calc(var(--safe-top) + 66px) 0 calc(var(--safe-bottom) + 90px);
  display:flex; flex-direction:column; gap:8px;
  animation:screenIn .35s var(--md-motion-standard);
}
.screen[hidden]{display:none}
@keyframes screenIn{
  0%{opacity:0; transform:translateY(10px)}
  100%{opacity:1; transform:translateY(0)}
}

#detailsScreen{padding-bottom:calc(var(--safe-bottom) + 40px)}

.page-head{
  position:fixed;
  top:calc(var(--safe-top) + 10px);
  inset-inline-start:10px;
  inset-inline-end:108px;
  height:44px;
  z-index:99;
  display:flex; align-items:center; gap:10px;
  padding:0; margin:0;
  background:transparent;
  pointer-events:none;
}
.page-head > *{pointer-events:auto}
.page-back{
  flex:none; width:40px; height:40px;
  border-radius:var(--md-shape-md);
  background:var(--md-surface-container-low);
  border:2px solid var(--cc-line);
  color:var(--md-on-surface-variant);
  display:grid; place-items:center;
  box-shadow:var(--md-elev-1);
  transition:transform var(--md-duration-short) var(--md-motion-standard),
             background var(--md-duration-short),
             color var(--md-duration-short),
             border-color var(--md-duration-short);
}
.page-back:active{transform:scale(.9)}
.page-back:hover{
  background:var(--md-surface-container);
  color:var(--md-primary);
  border-color:var(--md-primary);
}
.page-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page-titles{flex:1; min-width:0; display:flex; flex-direction:column; gap:0; overflow:hidden; padding-inline-end:4px}
.page-title{font-size:15px;font-weight:800;color:var(--md-on-surface);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-sub{font-size:10.5px;font-weight:600;color:var(--md-on-surface-variant);opacity:.8;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.theme-fab, .options-fab, .settings-fab{
  position:fixed;
  top:calc(var(--safe-top) + 10px);
  z-index:100;
  width:40px; height:40px;
  border-radius:var(--md-shape-md);
  background:var(--md-surface-container-low);
  border:2px solid var(--cc-line);
  color:var(--md-on-surface-variant);
  display:grid; place-items:center;
  box-shadow:var(--md-elev-1);
  transition:transform var(--md-duration-short) var(--md-motion-standard),
             background var(--md-duration-short),
             color var(--md-duration-short),
             border-color var(--md-duration-short);
}
.theme-fab{inset-inline-end:10px}
.options-fab{inset-inline-end:58px}
.settings-fab{inset-inline-end:58px}
.theme-fab:active, .options-fab:active, .settings-fab:active{transform:scale(.9)}
.theme-fab svg, .options-fab svg, .settings-fab svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  transition:transform var(--md-duration-medium) var(--md-motion-standard);
}
.options-fab[hidden], .settings-fab[hidden]{display:none}
.options-fab:hover, .settings-fab:hover{
  background:var(--md-surface-container);
  color:var(--md-primary);
  border-color:var(--md-primary);
}
.theme-fab.active{
  background:var(--md-primary); color:var(--md-on-primary);
  border-color:var(--md-primary);
}
.theme-fab.active svg{transform:rotate(180deg)}

.theme-popover{
  position:fixed;
  top:calc(var(--safe-top) + 58px);
  inset-inline-end:10px;
  z-index:101;
  background:var(--md-surface-container-low);
  border:2px solid var(--cc-line);
  border-radius:var(--md-shape-lg);
  padding:12px;
  box-shadow:var(--md-elev-3);
  opacity:0; pointer-events:none;
  transform:translateY(-8px) scale(.96);
  transform-origin:top right;
  transition:opacity .2s, transform .2s var(--md-motion-standard);
}
.theme-popover.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.theme-popover-title{
  font-size:10.5px;font-weight:800;color:var(--md-on-surface-variant);
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.theme-popover-title .active-name{
  font-size:9.5px;font-weight:700;
  color:var(--md-on-primary);background:var(--md-primary);
  padding:2px 7px;border-radius:var(--md-shape-full);
}
.theme-grid{display:grid;grid-template-columns:repeat(5,30px);gap:7px}
.theme-swatch{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--cc-line);
  padding:0;background:transparent;position:relative;
  transition:transform var(--md-duration-short) var(--md-motion-standard),
             box-shadow var(--md-duration-short),
             border-color var(--md-duration-short);
}
.theme-swatch:hover{transform:scale(1.08)}
.theme-swatch:active{transform:scale(.9)}
.theme-swatch.active{
  box-shadow:0 0 0 2px var(--md-surface-container-low),0 0 0 4px var(--md-primary);
  border-color:var(--md-primary);
}
.swatch-auto{
  background:linear-gradient(90deg,#f0e6cd 50%,#2a2118 50%);
  display:grid;place-items:center;color:#555;
}
.swatch-auto svg{width:14px;height:14px;fill:currentColor}
.swatch-auto.active{color:var(--md-primary)}

.add-fab{
  position:fixed;
  bottom:calc(var(--safe-bottom) + 20px);
  inset-inline-end:20px;
  z-index:90;
  width:54px;height:54px;
  border-radius:var(--md-shape-lg);
  background:var(--md-primary);
  color:var(--md-on-primary);
  display:grid;place-items:center;
  box-shadow:0 8px 24px color-mix(in srgb,var(--md-primary) 45%,transparent);
  transition:transform var(--md-duration-short) var(--md-motion-standard);
}
.add-fab[hidden]{display:none}
.add-fab:active{transform:scale(.9)}
.add-fab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

#welcomeScreen{
  justify-content:center;align-items:center;
  gap:22px;text-align:center;
  padding-inline:24px;
  padding-bottom:calc(var(--safe-bottom) + 24px);
}
.welcome-logo{
  width:88px;height:88px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--md-primary);color:var(--md-on-primary);
  box-shadow:0 14px 40px color-mix(in srgb,var(--md-primary) 42%,transparent);
  margin-bottom:6px;
}
.welcome-logo svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.welcome-title{font-size:26px;font-weight:800;color:var(--md-on-surface);letter-spacing:-.3px}
.welcome-sub{font-size:14px;font-weight:500;color:var(--md-on-surface-variant);opacity:.9;max-width:320px;line-height:1.7;margin-top:-10px}
.welcome-form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;margin-top:6px}

.field-label{font-size:12px;font-weight:800;color:var(--md-on-surface-variant);text-align:start;padding-inline-start:4px;margin-bottom:2px}
.field-input, .field-select, .field-textarea{
  width:100%;padding:13px 15px;
  border-radius:var(--md-shape-md);
  border:2px solid var(--cc-line);
  background:var(--md-surface-container-lowest);
  color:var(--md-on-surface);
  font-size:14.5px;font-weight:500;
  outline:none;
  transition:border-color var(--md-duration-short),
             box-shadow var(--md-duration-short),
             background var(--md-duration-short);
}
.field-input:focus, .field-select:focus, .field-textarea:focus{
  border-color:var(--md-primary);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--md-primary) 18%,transparent);
  background:var(--md-surface-container-low);
}
.field-input::placeholder{color:var(--md-on-surface-variant);opacity:.5}
.field-select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:left 14px center;
  background-size:16px;
  padding-inline-start:44px;
  cursor:pointer;
}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-row{display:flex;gap:10px}
.field-row > .field-group{flex:1;min-width:0}

.weekdays{display:flex;gap:6px;flex-wrap:wrap}
.weekday{
  flex:1 1 calc((100% - 36px) / 7);min-width:38px;
  padding:8px 0;
  border-radius:var(--md-shape-sm);
  border:1.5px solid var(--cc-line);
  background:var(--md-surface-container-lowest);
  color:var(--md-on-surface-variant);
  font-size:12px;font-weight:800;text-align:center;
  transition:transform var(--md-duration-short),
             background var(--md-duration-short),
             border-color var(--md-duration-short),
             color var(--md-duration-short);
}
.weekday:active{transform:scale(.92)}
.weekday.active{
  background:var(--md-primary);color:var(--md-on-primary);
  border-color:var(--md-primary);
}

.primary-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 22px;
  border-radius:var(--md-shape-md);
  border:2px solid var(--md-primary);
  background:var(--md-primary);color:var(--md-on-primary);
  font-size:15px;font-weight:800;
  box-shadow:0 6px 20px color-mix(in srgb,var(--md-primary) 35%,transparent);
  transition:transform var(--md-duration-short) var(--md-motion-standard),
             box-shadow var(--md-duration-short),
             opacity var(--md-duration-short);
}
.primary-btn:active{transform:scale(.97)}
.primary-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.primary-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.ghost-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;
  border-radius:var(--md-shape-md);
  border:2px solid var(--cc-line);
  background:var(--md-surface-container-lowest);
  color:var(--md-on-surface-variant);
  font-size:13.5px;font-weight:800;
  transition:transform var(--md-duration-short),
             background var(--md-duration-short),
             color var(--md-duration-short),
             border-color var(--md-duration-short);
}
.ghost-btn:hover{background:var(--md-surface-container);color:var(--md-on-surface)}
.ghost-btn:active{transform:scale(.96)}
.ghost-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.danger-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;
  border-radius:var(--md-shape-md);
  border:2px solid color-mix(in srgb,var(--md-error) 45%,var(--cc-line));
  background:var(--md-surface-container-lowest);
  color:var(--md-error);
  font-size:13.5px;font-weight:800;
  transition:transform var(--md-duration-short),
             background var(--md-duration-short),
             color var(--md-duration-short);
}
.danger-btn:hover{background:var(--md-error-container);color:var(--md-on-error-container)}
.danger-btn:active{transform:scale(.96)}
.danger-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.board-head{display:flex;flex-direction:column;gap:2px;padding:0 14px;margin-bottom:2px}
.board-head[hidden]{display:none}
.board-greeting{font-size:13px;color:var(--md-on-surface-variant);font-weight:600}
.board-name{font-size:22px;font-weight:800;color:var(--md-on-surface);line-height:1.25}
.board-name .name-part{color:var(--md-primary)}

.late-alert{
  margin-inline:8px;
  padding:11px 14px;
  background:color-mix(in srgb,var(--md-warning) 22%,var(--md-surface-container-lowest));
  border:1.5px solid var(--md-warning);
  border-radius:var(--md-shape-md);
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:700;
  color:var(--md-on-surface);
  cursor:pointer;
  transition:transform var(--md-duration-short);
  animation:slideStagger .4s var(--md-motion-standard);
}
.late-alert:active{transform:scale(.98)}
.late-alert svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:var(--md-warning);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.late-alert-text{flex:1;min-width:0;line-height:1.5}
.late-alert-text strong{display:block;font-weight:800;font-size:12.5px}
.late-alert-chevron{width:14px;height:14px;flex-shrink:0;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.7}

.today-card{
  position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--md-primary) 14%,var(--md-surface-container-lowest));
  border:2px solid var(--cc-line);
  border-radius:var(--md-shape-lg);
  padding:12px;
  box-shadow:var(--md-elev-1);
  display:flex;flex-direction:column;gap:8px;
  transition:max-height .3s var(--md-motion-standard);
}
.today-card::before{
  content:"";position:absolute;
  inset:-50% -30% auto auto;
  width:280px;height:280px;
  background:radial-gradient(circle,var(--cc-ochre) 0%,transparent 70%);
  opacity:.10;pointer-events:none;
}
.today-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.today-title{font-size:11.5px;font-weight:800;color:var(--md-on-surface-variant);display:flex;align-items:center;gap:5px}
.today-title svg{width:13px;height:13px;fill:none;stroke:var(--cc-ochre);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.today-head-right{display:flex;align-items:center;gap:6px}
.today-date{font-size:10.5px;font-weight:700;color:var(--md-on-surface-variant);opacity:.75}
.today-collapse{
  flex:none;width:24px;height:24px;border-radius:50%;
  background:transparent;color:var(--md-on-surface-variant);
  display:grid;place-items:center;

  transform:translateX(-50%);
  width:4px;height:4px;
  border-radius:50%;
  background:var(--cc-ochre);
}

.log-list{display:flex;flex-direction:column;gap:6px}
.log-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  border-radius:var(--md-shape-md);
  background:var(--md-surface-container-lowest);
  border:1.5px solid var(--cc-line);
  border-inline-start:3px solid var(--cc-ochre);
  cursor:pointer;
  transition:transform var(--md-duration-short),background var(--md-duration-short);
}
.log-item:hover{background:var(--md-surface-container)}
.log-item:active{transform:scale(.99)}
.log-date{flex:none;font-size:11px;font-weight:800;color:var(--md-on-surface-variant);direction:ltr;min-width:72px}
.log-status{flex:1;font-size:12px;font-weight:700;color:var(--md-on-surface)}
.log-status.done{color:var(--md-success)}
.log-status.skipped{color:var(--md-on-surface-variant);text-decoration:line-through}
.log-status.partial{color:var(--md-warning)}
.log-status.double{color:var(--md-primary);font-weight:900}
.log-note{
  font-size:10.5px;color:var(--md-on-surface-variant);
  opacity:.75;font-style:italic;max-width:120px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.empty-log{
  text-align:center;padding:22px 12px;
  font-size:12.5px;color:var(--md-on-surface-variant);opacity:.8;
}

.settings-group{
  background:var(--md-surface-container-low);
  border:2px solid var(--cc-line);
  border-radius:var(--md-shape-lg);
  margin-inline:12px;
  overflow:hidden;
}
.settings-group-title{
  font-size:11px;font-weight:800;
  color:var(--md-on-surface-variant);
  opacity:.75;letter-spacing:.4px;
  padding:12px 14px 6px;
}
.settings-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
  border-bottom:1px solid var(--cc-line);
  cursor:pointer;
  transition:background var(--md-duration-short);
  font-size:14px;font-weight:700;
  color:var(--md-on-surface);
  width:100%;
  text-align:start;
}
.settings-item:last-child{border-bottom:0}
.settings-item:hover{background:var(--md-surface-container)}
.settings-item:active{background:var(--md-surface-container-high)}
.settings-item svg.icon{
  width:20px;height:20px;
  flex-shrink:0;
  fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  color:var(--md-on-surface-variant);
  transition:color var(--md-duration-short);
}
.settings-item:hover svg.icon{color:var(--md-primary)}
.settings-item.danger{color:var(--md-error)}
.settings-item.danger svg.icon{color:var(--md-error)}
.settings-item.danger:hover{background:var(--md-error-container);color:var(--md-on-error-container)}
.settings-item-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.settings-item-label{font-weight:800}
.settings-item-desc{font-size:11px;font-weight:500;color:var(--md-on-surface-variant);opacity:.8}
.settings-item-chevron{
  width:16px;height:16px;flex-shrink:0;
  fill:none;stroke:currentColor;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;opacity:.55;
}

.stats-hero{
  margin-inline:12px;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
}
.stats-hero .stat-box{padding:16px 12px}
.stats-hero .stat-value{font-size:26px}

.chart-card{
  margin-inline:12px;
  background:var(--md-surface-container-low);
  border:2px solid var(--cc-line);
  border-radius:var(--md-shape-lg);
  padding:14px;
}
.chart-title{
  font-size:12px;font-weight:800;
  color:var(--md-on-surface-variant);
  margin-bottom:10px;
}
.chart-svg{width:100%;height:120px;display:block}
.chart-bar{transition:fill var(--md-duration-short)}
.chart-bar.zero{fill:var(--md-surface-container-high)}
.chart-bar.some{fill:var(--md-warning);opacity:.7}
.chart-bar.full{fill:var(--md-success)}
.chart-bar.today{stroke:var(--md-primary);stroke-width:1.5}

.sheet-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;
  left:0;right:0;bottom:0;z-index:201;
  background:var(--md-surface-container-low);
  border-top:2px solid var(--cc-line);
  border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.25);
  transform:translateY(100%);
  transition:transform .35s var(--md-motion-standard);
  max-width:min(520px, 100%);
  margin-inline:auto;
  padding:8px 20px calc(var(--safe-bottom) + 22px);
  display:flex;flex-direction:column;gap:12px;
  max-height:85vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{
  width:44px;height:5px;border-radius:3px;
  background:var(--cc-line);
  margin:4px auto 6px;flex-shrink:0;
}
.sheet-title{font-size:15px;font-weight:800;color:var(--md-on-surface)}
.sheet-sub{font-size:12px;color:var(--md-on-surface-variant);opacity:.8;margin-top:-6px}
.sheet-menu{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.sheet-menu-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 15px;
  border-radius:var(--md-shape-md);
  border:1.5px solid var(--cc-line);
  background:var(--md-surface-container-lowest);
  color:var(--md-on-surface);
  font-size:14px;font-weight:800;
  text-align:start;width:100%;
  animation:sheetItemIn .3s var(--md-motion-standard) backwards;
  transition:transform var(--md-duration-short),
             background var(--md-duration-short),
             border-color var(--md-duration-short),
             color var(--md-duration-short);
}
.sheet-menu-item:nth-child(1){animation-delay:.03s}
.sheet-menu-item:nth-child(2){animation-delay:.06s}
.sheet-menu-item:nth-child(3){animation-delay:.09s}
.sheet-menu-item:nth-child(4){animation-delay:.12s}
.sheet-menu-item:nth-child(5){animation-delay:.15s}
.sheet-menu-item:nth-child(6){animation-delay:.18s}
.sheet-menu-item:active{transform:scale(.98)}
.sheet-menu-item:hover{background:var(--md-surface-container);border-color:var(--md-primary)}
.sheet-menu-item svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  color:var(--md-on-surface-variant);
  flex-shrink:0;
  transition:color var(--md-duration-short);
}
.sheet-menu-item:hover svg{color:var(--md-primary)}
.sheet-menu-item.danger{color:var(--md-error)}
.sheet-menu-item.danger svg{color:var(--md-error)}
.sheet-menu-item.danger:hover{
  background:var(--md-error-container);
  border-color:var(--md-error);
  color:var(--md-on-error-container);
}
.sheet-menu-item.danger:hover svg{color:var(--md-on-error-container)}
.sheet-menu-item.success svg{color:var(--md-success)}
.sheet-menu-item.warning svg{color:var(--md-warning)}

.day-options{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.day-option{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border-radius:var(--md-shape-md);
  border:2px solid var(--cc-line);
  background:var(--md-surface-container-lowest);
  color:var(--md-on-surface);
  font-size:13.5px;font-weight:800;
  text-align:start;width:100%;
  cursor:pointer;
  transition:transform var(--md-duration-short),
             background var(--md-duration-short),
             border-color var(--md-duration-short);
}
.day-option:active{transform:scale(.97)}
.day-option.selected{
  background:color-mix(in srgb,var(--md-primary) 18%,var(--md-surface-container));
  border-color:var(--md-primary);
  color:var(--md-primary);
}
.day-option svg{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.day-option-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.day-option-label{font-weight:800}
.day-option-desc{font-size:11px;font-weight:500;color:var(--md-on-surface-variant);opacity:.75}

.toast{
  position:fixed;
  bottom:calc(var(--safe-bottom) + 84px);
  left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--md-surface-container-high);
  color:var(--md-on-surface);
  border:1.5px solid var(--cc-line);
  padding:10px 18px;
  border-radius:var(--md-shape-full);
  font-size:12.5px;font-weight:700;
  z-index:9999;
  box-shadow:var(--md-elev-3);
  opacity:0;
  transition:opacity .22s, transform .22s var(--md-motion-standard);
  pointer-events:none;
  max-width:min(90vw,340px);
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes popIn{0%{opacity:0;transform:scale(.9) translateY(6px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideStagger{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes popCheck{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fillBar{from{width:0}}
@keyframes calendarPop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes fabPop{0%{opacity:0;transform:scale(.4) translateY(24px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sheetItemIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}

.anim .today-item{animation:slideStagger .4s var(--md-motion-standard) backwards}
.anim .today-item:nth-child(1){animation-delay:.04s}
.anim .today-item:nth-child(2){animation-delay:.09s}
.anim .today-item:nth-child(3){animation-delay:.14s}
.anim .today-item:nth-child(4){animation-delay:.19s}
.anim .today-item:nth-child(5){animation-delay:.24s}
.anim .activity-card{animation:slideStagger .45s var(--md-motion-standard) backwards}
.anim .activity-card:nth-child(1){animation-delay:.06s}
.anim .activity-card:nth-child(2){animation-delay:.12s}
.anim .activity-card:nth-child(3){animation-delay:.18s}
.anim .activity-card:nth-child(4){animation-delay:.24s}
.anim .activity-card:nth-child(5){animation-delay:.30s}
.anim .type-card{animation:slideStagger .4s var(--md-motion-standard) backwards}
.anim .type-card:nth-child(1){animation-delay:.04s}
.anim .type-card:nth-child(2){animation-delay:.09s}
.anim .type-card:nth-child(3){animation-delay:.14s}
.anim .type-card:nth-child(4){animation-delay:.19s}
.anim .type-card:nth-child(5){animation-delay:.24s}
.anim .stat-box{animation:popIn .4s var(--md-motion-standard) backwards}
.anim .stat-box:nth-child(1){animation-delay:.05s}
.anim .stat-box:nth-child(2){animation-delay:.11s}
.anim .stat-box:nth-child(3){animation-delay:.17s}
.anim .details-hero{animation:popIn .4s var(--md-motion-standard)}
.anim .calendar-day.done{animation:calendarPop .4s var(--md-motion-standard) backwards}
.anim .calendar-day.missed{animation:popIn .35s var(--md-motion-standard) backwards}
.add-fab:not([hidden]){animation:fabPop .35s var(--md-motion-standard)}
.options-fab:not([hidden]){animation:fabPop .35s var(--md-motion-standard)}
.settings-fab:not([hidden]){animation:fabPop .35s var(--md-motion-standard)}
.today-item-check.checked svg{animation:popCheck .3s var(--md-motion-standard)}

@media (max-width:380px){
  .welcome-title{font-size:23px}
  .board-name{font-size:20px}
  .activity-name{font-size:14px}
  .today-item-value{font-size:12px}
  .theme-grid{grid-template-columns:repeat(5,26px);gap:6px}
  .theme-swatch{width:26px;height:26px}
  .stat-value{font-size:17px}
  .stats-hero .stat-value{font-size:22px}
  .page-head{inset-inline-end:100px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="top-bar" id="topBar" hidden></div>

<button class="theme-fab" id="themeFab" aria-label="تبديل الثيم" aria-expanded="false" type="button">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
</button>

  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="5" r="1.6"/>
    <circle cx="12" cy="12" r="1.6"/>
    <circle cx="12" cy="19" r="1.6"/>
  </svg>
</button>

  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5h0a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
  </svg>
</button>

<div class="theme-popover" id="themePopover" role="menu" aria-label="اختيار الثيم">

    <span>الثيم</span>
    <span class="active-name" id="activeThemeName">تلقائي</span>
  </div>
  <div class="theme-grid">
    <button class="theme-swatch swatch-auto" data-theme="auto" title="تلقائي" aria-label="تلقائي" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 0 1 0 14V5z"/></svg>
    </button>
    <button class="theme-swatch" data-theme="clay"       style="background:#a85c3f" title="طيني"      aria-label="طيني" type="button"></button>
    <button class="theme-swatch" data-theme="dark"       style="background:#2a2118" title="داكن"      aria-label="داكن" type="button"></button>
    <button class="theme-swatch" data-theme="red"        style="background:#B3261E" title="أحمر"      aria-label="أحمر" type="button"></button>
    <button class="theme-swatch" data-theme="blue"       style="background:#1565C0" title="أزرق"      aria-label="أزرق" type="button"></button>
    <button class="theme-swatch" data-theme="emerald"    style="background:#146C2E" title="زمردي"     aria-label="زمردي" type="button"></button>
    <button class="theme-swatch" data-theme="purple"     style="background:#6750A4" title="بنفسجي"    aria-label="بنفسجي" type="button"></button>
    <button class="theme-swatch" data-theme="gold"       style="background:#B26A00" title="ذهبي"      aria-label="ذهبي" type="button"></button>
    <button class="theme-swatch" data-theme="slate"      style="background:#4A5560" title="رمادي"     aria-label="رمادي" type="button"></button>
    <button class="theme-swatch" data-theme="pink"       style="background:#B3456E" title="وردي"      aria-label="وردي" type="button"></button>
    <button class="theme-swatch" data-theme="teal"       style="background:#00796B" title="فيروزي"    aria-label="فيروزي" type="button"></button>
    <button class="theme-swatch" data-theme="terracotta" style="background:#B5532B" title="طيني داكن" aria-label="طيني داكن" type="button"></button>
    <button class="theme-swatch" data-theme="olive"      style="background:#6B7A1F" title="زيتوني"    aria-label="زيتوني" type="button"></button>
    <button class="theme-swatch" data-theme="indigo"     style="background:#3949AB" title="نيلي"      aria-label="نيلي" type="button"></button>
    <button class="theme-swatch" data-theme="sepia"      style="background:#7A5230" title="بني داكن"  aria-label="بني داكن" type="button"></button>
  </div>
</div>

<section class="screen" id="welcomeScreen" hidden>
  <span class="welcome-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M4 6a2 2 0 0 1 2-2h6l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
  </span>
  <h1 class="welcome-title">مِسار</h1>
  <p class="welcome-sub">رفيقك اليومي في متابعة الحفظ والمراجعة والقراءة</p>
  <form class="welcome-form" id="welcomeForm" autocomplete="off">
    <label class="field-label" for="nameInput">ما اسمك؟</label>
    <input type="text" id="nameInput" class="field-input" placeholder="اكتب اسمك هنا" maxlength="30" autocomplete="off" required>
    <button class="primary-btn" id="welcomeBtn" type="submit" disabled>
      <span>ابدأ الآن</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>
    </button>

</section>

<section class="screen" id="boardScreen" hidden>
  <header class="board-head">
    <span class="board-greeting" id="boardGreeting">مرحبًا</span>
    <h1 class="board-name"><span class="name-part" id="boardName">صديقي</span></h1>
  </header>

  <div id="lateAlertContainer"></div>

  <div class="today-card" id="todayCard">
    <div class="today-head">
      <span class="today-title">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>

        <span>ورد اليوم</span>
      </span>
      <div class="today-head-right">

    <button class="page-back" id="pickBack" type="button" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>

    <div class="page-titles">
      <h1 class="page-title">إضافة نشاط</h1>
      <span class="page-sub">ما نوع النشاط الذي تريد تتبّعه؟</span>

  <div class="type-grid" id="typeGrid">
    <button class="type-card" data-type="hifz" type="button">

<script>
'use strict';
(function(){
  const $ = id => document.getElementById(id);

  /* ═══════════════════════════════════════
     🚀 Telegram Web App Init
     ═══════════════════════════════════════ */
  const tg = window.Telegram?.WebApp || null;
  const isTelegram = !!(tg && tg.initData !== undefined);
  let tgUser = null;

  if (isTelegram){
    document.body.classList.add('tg-app');
    document.documentElement.classList.add('tg-app');

    try {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes?.();
      tg.enableClosingConfirmation?.();
      tg.BackButton?.hide();
      tg.MainButton?.hide();

      if (tg.initDataUnsafe?.user){
        tgUser = tg.initDataUnsafe.user;
      }

      const setViewportHeight = () => {
        const h = tg.viewportStableHeight || tg.viewportHeight;
        if (h){
          document.documentElement.style.setProperty('--tg-viewport-height', h + 'px');
        }
      };
      setViewportHeight();
      tg.onEvent?.('viewportChanged', setViewportHeight);
    } catch(e){
      console.warn('Telegram init error', e);
    }
  }

  /* ═══════ الثيم ═══════ */
  const html = document.documentElement;
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  const themeFab = $('themeFab');
  const themePopover = $('themePopover');
  const activeNameEl = $('activeThemeName');
  const themeSwatches = document.querySelectorAll('.theme-swatch');

  const THEME_LABELS = {
    auto:'تلقائي', clay:'طيني', dark:'داكن', red:'أحمر', blue:'أزرق',
    emerald:'زمردي', purple:'بنفسجي', gold:'ذهبي', slate:'رمادي',
    pink:'وردي', teal:'فيروزي', terracotta:'طيني داكن',
    olive:'زيتوني', indigo:'نيلي', sepia:'بني داكن'
  };
  const VALID_THEMES = new Set(Object.keys(THEME_LABELS));

  function applyTheme(name){
    if (!VALID_THEMES.has(name)) name = 'auto';
    const eff = (name === 'auto') ? (media.matches ? 'dark' : 'clay') : name;
    html.setAttribute('data-theme', eff);
    html.setAttribute('data-theme-name', name);
    if (activeNameEl) activeNameEl.textContent = THEME_LABELS[name] || name;
    themeSwatches.forEach(s => s.classList.toggle('active', s.dataset.theme === name));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta){
      requestAnimationFrame(() => {
        const surface = getComputedStyle(html).getPropertyValue('--md-surface').trim();
        if (surface) meta.content = surface;
        // تحديث ثيم Telegram
        if (isTelegram){
          try {
            const color = surface || '#e8dcc0';
            tg.setHeaderColor?.(color);
            tg.setBackgroundColor?.(color);
          } catch(e){}
        }
      });
    }
    try { localStorage.setItem('misar-theme', name); } catch(e){}
  }

  function openPopover(){
    themePopover.classList.add('open');
    themeFab.classList.add('active');
    themeFab.setAttribute('aria-expanded', 'true');
  }
  function closePopover(){
    themePopover.classList.remove('open');
    themeFab.classList.remove('active');
    themeFab.setAttribute('aria-expanded', 'false');
  }

  themeFab.addEventListener('click', (e) => {
    e.stopPropagation();
    themePopover.classList.contains('open') ? closePopover() : openPopover();
  });
  document.addEventListener('click', (e) => {
    if (!themePopover.classList.contains('open')) return;
    if (themePopover.contains(e.target) || themeFab.contains(e.target)) return;
    closePopover();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && themePopover.classList.contains('open')) closePopover();
  });
  themeSwatches.forEach(b => b.addEventListener('click', () => {
    applyTheme(b.dataset.theme);
    if (navigator.vibrate) navigator.vibrate(6);
    setTimeout(closePopover, 160);
  }));

  function onSystemChange(){
    if (html.getAttribute('data-theme-name') === 'auto') applyTheme('auto');
  }
  if (media.addEventListener) media.addEventListener('change', onSystemChange);
  else if (media.addListener) media.addListener(onSystemChange);

  /* ═══════ التوست ═══════ */
  const toastEl = $('toast');
  let toastTimer = null;
  function toast(msg, ms){
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 2400);
    if (isTelegram && tg.HapticFeedback){
      try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
    }
  }

  /* ═══════ التخزين + نسخة احتياطية تلقائية ═══════ */
  const KEYS = {
    profile:'misar-profile',
    activities:'misar-activities',
    collapsed:'misar-today-collapsed',
    backup:'misar-auto-backup',
    dismissedLate:'misar-dismissed-late',
    lastBackup:'misar-last-backup-date'
  };

  const Storage = {
    getProfile(){
      try { const r = localStorage.getItem(KEYS.profile); return r ? JSON.parse(r) : null; } catch(e){ return null; }
    },
    saveProfile(data){
      try { localStorage.setItem(KEYS.profile, JSON.stringify(data)); } catch(e){}
    },
    getActivities(){
      try {
        const r = localStorage.getItem(KEYS.activities);
        if (!r) return [];
        const a = JSON.parse(r);
        return Array.isArray(a) ? a : [];
      } catch(e){ return []; }
    },
    saveActivities(list){
      try {
        localStorage.setItem(KEYS.activities, JSON.stringify(list));
        const today = todayKey();
        const lastBackup = localStorage.getItem(KEYS.lastBackup);
        if (lastBackup !== today){
          localStorage.setItem(KEYS.backup, JSON.stringify({
            savedAt: Date.now(),
            profile: this.getProfile(),
            activities: list
          }));
          localStorage.setItem(KEYS.lastBackup, today);
        }
      } catch(e){}
    },
    getBackup(){
      try {
        const r = localStorage.getItem(KEYS.backup);
        return r ? JSON.parse(r) : null;
      } catch(e){ return null; }
    },
    getActivity(id){
      return this.getActivities().find(a => a.id === id) || null;
    },
    upsertActivity(activity){
      const list = this.getActivities();
      const i = list.findIndex(a => a.id === activity.id);
      if (i >= 0) list[i] = activity; else list.push(activity);
      this.saveActivities(list);
    },
    deleteActivity(id){
      const list = this.getActivities().filter(a => a.id !== id);
      this.saveActivities(list);
    },
    clearAll(){
      try {
        [KEYS.profile, KEYS.activities, KEYS.backup, KEYS.dismissedLate, KEYS.lastBackup].forEach(k => localStorage.removeItem(k));
      } catch(e){}
    },
    getCollapsed(){
      try { return localStorage.getItem(KEYS.collapsed) === '1'; } catch(e){ return false; }
    },
    setCollapsed(v){
      try { localStorage.setItem(KEYS.collapsed, v ? '1' : '0'); } catch(e){}
    },
    getDismissedLate(){
      try { return localStorage.getItem(KEYS.dismissedLate) || ''; } catch(e){ return ''; }
    },
    setDismissedLate(key){
      try { localStorage.setItem(KEYS.dismissedLate, key); } catch(e){}
    }
  };

  /* ═══════ الأنواع والأيقونات ═══════ */
  const TYPES = {
    hifz:      { label:'حفظ',       color:'#2e7d32' },
    review:    { label:'مراجعة',    color:'#1565C0' },
    reading:   { label:'قراءة',     color:'#B26A00' },
    listening: { label:'استماع',    color:'#6750A4' },
    track:     { label:'تتبّع حر',  color:'#00796B' }
  };

  const ICONS = {
    hifz: '<path d="M4 5a2 2 0 0 1 2-2h11v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h11"/><path d="M9 9l2 2 3-3"/>',
    review: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 4v4h4"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M21 20v-4h-4"/>',
    reading: '<path d="M4 5a2 2 0 0 1 2-2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/>',
    listening: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>',
    track: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/>'
  };

  const WEEKDAYS_AR = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const WEEKDAYS_SHORT = ['ح','ن','ث','ر','خ','ج','س'];
  const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  const UNIT_OPTIONS = {
    page: 'صفحات',
    ayah: 'آيات',
    hizb: 'أحزاب',
    juz:  'أجزاء'
  };

  const STATUS_LABELS = {
    done:    { label:'✓ مُنجز',    short:'✓' },
    skipped: { label:'متخطّى',      short:'—' },
    partial: { label:'جزئي',       short:'◐' },
    double:  { label:'مضاعف ✓✓',  short:'✓✓' }
  };

  function dateKey(d){
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function todayKey(){ return dateKey(); }
  function parseDateKey(k){
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(d, n){
    const r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }
  function formatToday(){
    const d = new Date();
    return `${WEEKDAYS_AR[d.getDay()]} · ${d.getDate()} ${MONTHS_AR[d.getMonth()]}`;
  }
  function formatDate(k){
    if (!k) return '—';
    const d = parseDateKey(k);
    return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
  }

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function escapeHtml(str){
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function countActiveDaysBetween(startKey, endKey, activeDays){
    if (!startKey) return 0;
    const start = parseDateKey(startKey);
    const end = parseDateKey(endKey);
    let count = 0;
    const cur = new Date(start);
    while (cur < end){
      if (activeDays.includes(cur.getDay())) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function findStartDate(targetCount, activeDays){
    let d = new Date();
    let count = 0;
    let guard = 0;
    while (count < targetCount && guard < 3650){
      d = addDays(d, -1);
      if (activeDays.includes(d.getDay())) count++;
      guard++;
    }
    return dateKey(d);
  }

  function computeTodayWird(activity, dateK){
    const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
    const dow = parseDateKey(dateK).getDay();
    const isRest = !activeDays.includes(dow);

    if (activity.status === 'paused'){
      return { status: 'paused', label: 'موقوف مؤقتًا' };
    }
    if (activity.status === 'finished'){
      return { status: 'finished', label: 'مكتمل ✓' };
    }
    if (activity.type === 'track'){
      return { status: isRest ? 'rest' : 'pending', label: isRest ? 'يوم راحة' : 'تسجيل حر' };
    }
    if (isRest){
      return { status: 'rest', label: 'يوم راحة' };
    }
    const start = activity.pace?.startDate;
    if (!start){
      return { status: 'pending', label: '—' };
    }
    if (activity.type === 'hifz' || activity.type === 'review'){
      const cfg = activity.config || {};
      const from = cfg.from ?? 1;
      const to   = cfg.to   ?? (from + 30);
      const per  = activity.pace?.unitsPerDay || 1;
      const passed = countActiveDaysBetween(start, dateK, activeDays);
      const currFrom = from + passed * per;
      const currTo   = Math.min(currFrom + per - 1, to);
      if (currFrom > to){
        return { status: 'finished', label: 'اكتملت الخطة 🎉' };
      }
      return { status: 'pending', from: currFrom, to: currTo, label: `${currFrom} → ${currTo}` };
    }
    if (activity.type === 'reading'){
      const cfg = activity.config || {};
      if (cfg.mode === 'khatma'){
        return { status: 'pending', label: 'ورد الختمة' };
      }
      return { status: 'pending', label: cfg.amount ? `${cfg.amount} ${UNIT_OPTIONS[cfg.unit] || ''}` : 'ورد القراءة' };
    }
    if (activity.type === 'listening'){
      const cfg = activity.config || {};
      return { status: 'pending', label: cfg.amount ? `${cfg.amount} دقيقة` : 'استماع يومي' };
    }
    return { status: 'pending', label: '—' };
  }

  function computeProgress(activity){
    const log = activity.log || [];
    const done = log.filter(l => l.status === 'done').length;
    const double = log.filter(l => l.status === 'double').length;
    const partial = log.filter(l => l.status === 'partial').length;
    const effectiveDone = done + double * 2 + partial * 0.5;

    if (activity.type === 'track'){
      return { percent: 0, done, total: 0, label: `${done + double} يوم` };
    }
    if (activity.type === 'hifz' || activity.type === 'review'){
      const cfg = activity.config || {};
      const from = cfg.from ?? 1;
      const to   = cfg.to   ?? from;
      const per  = activity.pace?.unitsPerDay || 1;
      const totalUnits = Math.max(0, to - from + 1);
      const doneUnits  = effectiveDone * per;
      const percent = totalUnits > 0 ? Math.min(100, Math.round((doneUnits / totalUnits) * 100)) : 0;
      return { percent, done, total: totalUnits, label: `${Math.min(Math.round(doneUnits), totalUnits)} من ${totalUnits}` };
    }
    if (activity.type === 'reading'){
      const cfg = activity.config || {};
      if (cfg.mode === 'khatma' && cfg.durationDays){
        const percent = Math.min(100, Math.round((effectiveDone / cfg.durationDays) * 100));
        return { percent, done, total: cfg.durationDays, label: `${Math.round(effectiveDone)} من ${cfg.durationDays} يوم` };
      }
      return { percent: 0, done, total: 0, label: `${done + double} يوم منجز` };
    }
    if (activity.type === 'listening'){
      return { percent: 0, done, total: 0, label: `${done + double} يوم منجز` };
    }
    return { percent: 0, done, total: 0, label: `${done + double} يوم` };
  }

  function computeStreak(activity){
    const log = activity.log || [];
    if (!log.length) return { current: 0, best: 0 };
    const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
    const doneMap = {};
    log.forEach(l => { if (l.status === 'done' || l.status === 'double') doneMap[l.date] = true; });

    let current = 0;
    let cursor = new Date();
    const MAX_LOOKBACK = 365;
    let started = false;
    for (let i = 0; i < MAX_LOOKBACK; i++){
      const key = dateKey(cursor);
      const isActive = activeDays.includes(cursor.getDay());
      if (isActive){
        if (doneMap[key]){ current++; started = true; }
        else if (started){ break; }
        else if (i > 1){ break; }
      }
      cursor = addDays(cursor, -1);
    }
    const sorted = Object.keys(doneMap).sort();
    let best = 0, run = 0;
    if (sorted.length){
      let prev = null;
      sorted.forEach(k => {
        const d = parseDateKey(k);
        if (prev){
          let gap = 0;
          let check = addDays(prev, 1);
          while (check < d){
            if (activeDays.includes(check.getDay())) gap++;
            check = addDays(check, 1);
          }
          if (gap === 0) run++; else run = 1;
        } else { run = 1; }
        prev = d;
        if (run > best) best = run;
      });
    }
    return { current, best: Math.max(best, current) };
  }

  function estimateDaysRemaining(activity){
    const log = activity.log || [];
    const done = log.filter(l => l.status === 'done').length;
    const double = log.filter(l => l.status === 'double').length;
    const partial = log.filter(l => l.status === 'partial').length;
    const effectiveDone = done + double * 2 + partial * 0.5;

    if (activity.type === 'track') return null;
    if (activity.type === 'hifz' || activity.type === 'review'){
      const cfg = activity.config || {};
      const from = cfg.from ?? 1;
      const to   = cfg.to   ?? from;
      const per  = activity.pace?.unitsPerDay || 1;
      const totalUnits = Math.max(0, to - from + 1);
      const totalActiveDays = Math.ceil(totalUnits / per);
      return Math.max(0, Math.ceil(totalActiveDays - effectiveDone));
    }
    if (activity.type === 'reading' && activity.config?.mode === 'khatma'){
      const total = activity.config.durationDays || 0;
      return Math.max(0, Math.ceil(total - effectiveDone));
    }
    return null;
  }

  function computeEndDate(activity){
    if (activity.type === 'track') return null;
    const daysRemaining = estimateDaysRemaining(activity);
    if (daysRemaining == null) return null;
    const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
    let d = new Date();
    let count = 0;
    let guard = 0;
    while (count < daysRemaining && guard < 3650){
      d = addDays(d, 1);
      if (activeDays.includes(d.getDay())) count++;
      guard++;
    }
    return dateKey(d);
  }

  function computeDayNumber(activity){
    if (activity.type === 'track') return null;
    const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
    const start = activity.pace?.startDate;
    if (!start) return null;
    const totalUnits = (activity.config?.to ?? 0) - (activity.config?.from ?? 0) + 1;
    const per = activity.pace?.unitsPerDay || 1;
    const totalDays = Math.ceil(totalUnits / per);
    const passed = countActiveDaysBetween(start, todayKey(), activeDays) + 1;
    return { current: Math.min(passed, totalDays), total: totalDays };
  }

  function computeDayStatus(activity, dateK){
    const log = activity.log || [];
    return log.find(l => l.date === dateK)?.status || null;
  }

  function countMissedDays(activity){
    if (activity.status !== 'active') return 0;
    if (activity.type === 'track') return 0;
    const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
    const start = activity.pace?.startDate;
    if (!start) return 0;
    const today = todayKey();
    if (start >= today) return 0;
    const log = activity.log || [];
    const logMap = {};
    log.forEach(l => { logMap[l.date] = l.status; });
    let missed = 0;
    let cur = parseDateKey(start);
    const end = parseDateKey(today);
    while (cur < end){
      const k = dateKey(cur);
      if (activeDays.includes(cur.getDay()) && !logMap[k]){
        missed++;
      }
      cur = addDays(cur, 1);
    }
    return missed;
  }

  /* ═══════ التنقل ═══════ */
  const screens = {

  let currentScreen = 'welcome';

  let animateDetailsOnce = true;

  function updateTelegramBackButton(){
    if (!isTelegram || !tg.BackButton) return;
    const shouldShow = currentScreen !== 'welcome' && currentScreen !== 'board';
    if (shouldShow){ tg.BackButton.show(); }
    else { tg.BackButton.hide(); }
  }

  function showScreen(name, opts){
    opts = opts || {};
    if (!screens[name]) return;
    if (!opts.skipHistory && currentScreen && currentScreen !== name){
      historyStack.push(currentScreen);
    }
    Object.keys(screens).forEach(k => { screens[k].hidden = (k !== name); });
    currentScreen = name;
    addFab.hidden = (name !== 'board');
    optionsFab.hidden = (name !== 'details');
    settingsFab.hidden = (name !== 'board');
    topBar.hidden = !(name === 'pickType' || name === 'form' || name === 'details' || name === 'settings' || name === 'archive' || name === 'stats');

    if (name === 'board')   animateBoardOnce = true;
    if (name === 'details') animateDetailsOnce = true;

    updateTelegramBackButton();

    try { window.scrollTo(0, 0); } catch(e){}
  }

  function goBack(){
    const prev = historyStack.pop();
    if (prev) showScreen(prev, { skipHistory: true });
    else showScreen('board', { skipHistory: true });
  }

  // ربط زر الرجوع في Telegram
  if (isTelegram && tg.BackButton){

  /* ═══════ الترحيب ═══════ */
  const welcomeForm = $('welcomeForm');

      name,
      createdAt: Date.now(),
      telegramId: tgUser?.id || null,
      telegramUsername: tgUser?.username || null
    });
    if (navigator.vibrate) navigator.vibrate(12);
    if (isTelegram && tg.HapticFeedback){
      try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
    }
    toast(`أهلًا بك، ${name} 🌿`);
    renderBoard();
    showScreen('board', { skipHistory: true });

  /* ═══════ طي بطاقة اليوم ═══════ */
  const todayCard = $('todayCard');

  /* ═══════ اللوحة ═══════ */
  function renderBoard(){
    const profile = Storage.getProfile();
    const name = profile?.name || 'صديقي';
    $('boardGreeting').textContent = 'مرحبًا';

  function renderLateAlert(activities){
    const container = $('lateAlertContainer');
    container.innerHTML = '';
    const dismissed = Storage.getDismissedLate();
    const today = todayKey();

    const late = activities.filter(a => {
      if (a.status !== 'active') return false;
      const m = countMissedDays(a);
      return m >= 2;
    });

    if (late.length === 0){ return; }

    const dismissKey = today + '|' + late.map(a => a.id).join(',');
    if (dismissed === dismissKey){ return; }

    const totalMissed = late.reduce((s, a) => s + countMissedDays(a), 0);
    container.innerHTML = `
      <div class="late-alert" id="lateAlert">
        <svg viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
        <span class="late-alert-text">
          <strong>لديك ${totalMissed} يوم فائت</strong>
          اضغط لمعالجة التأخر
        </span>
        <svg class="late-alert-chevron" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
    `;
    $('lateAlert').addEventListener('click', () => openLateSheet(late, dismissKey));
  }

  function openLateSheet(lateActivities, dismissKey){
    const sheet = $('sheet');
    const sheetTitleEl = $('sheetTitle');
    const sheetSubEl = $('sheetSub');
    const sheetBodyEl = $('sheetBody');

    sheetTitleEl.textContent = 'معالجة التأخر';

    const html_ = `
      <div class="day-options">
        <button class="day-option" data-opt="skip" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
          <span class="day-option-text">
            <span class="day-option-label">تخطّي الأيام الفائتة</span>
            <span class="day-option-desc">تُسجّل كأيام راحة — لن تُحسب ضدك</span>
          </span>
        </button>
        <button class="day-option" data-opt="redistribute" type="button">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 4v4h4"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M21 20v-4h-4"/></svg>

          </span>
        </button>
        <button class="day-option" data-opt="dismiss" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
          <span class="day-option-text">
            <span class="day-option-label">تجاهل الآن</span>
            <span class="day-option-desc">سيظهر التنبيه في المرة القادمة</span>
          </span>
        </button>
      </div>
    `;

    sheetBodyEl.innerHTML = html_;
    $('sheetBackdrop').classList.add('open');
    sheet.classList.add('open');

    sheetBodyEl.querySelectorAll('[data-opt]').forEach(btn => {
      btn.addEventListener('click', () => {
        const opt = btn.dataset.opt;
        closeSheet();
        setTimeout(() => handleLateOption(opt, lateActivities, dismissKey), 200);
      });
    });
  }

  function handleLateOption(opt, activities, dismissKey){
    if (opt === 'dismiss'){
      Storage.setDismissedLate(dismissKey);
      renderBoard();
      return;
    }
    if (opt === 'skip'){
      activities.forEach(a => {
        const activeDays = a.pace?.activeDays || [0,1,2,3,4,5,6];
        const logMap = {};
        (a.log || []).forEach(l => { logMap[l.date] = true; });
        let cur = parseDateKey(a.pace.startDate);
        const end = new Date();
        while (cur < end){
          const k = dateKey(cur);
          if (activeDays.includes(cur.getDay()) && !logMap[k]){
            a.log = a.log || [];
            a.log.push({ date: k, status: 'skipped', markedAt: Date.now() });
          }
          cur = addDays(cur, 1);
        }
        Storage.upsertActivity(a);
      });
      toast('تم التخطي ✓');
    }
    if (opt === 'redistribute'){
      activities.forEach(a => {
        if (a.type === 'track') return;
        const activeDays = a.pace?.activeDays || [0,1,2,3,4,5,6];
        const done = (a.log || []).filter(l =>
          l.status === 'done' || l.status === 'double' || l.status === 'partial'
        ).length;
        a.pace.startDate = findStartDate(done, activeDays);
        Storage.upsertActivity(a);
      });
      toast('تم إعادة التوزيع ✓');
    }
    Storage.setDismissedLate(dismissKey);
    renderBoard();
  }

  function renderTodayCard(animate){
    $('todayDate').textContent = formatToday();
    const todayBody = $('todayBody');
    const activities = Storage.getActivities().filter(a => !a.archived);

    if (activities.length === 0){
      todayBody.innerHTML = `<div class="today-empty">لم تُضِف أي نشاط بعد.</div>`;
      return;
    }

    const today = todayKey();
    const rows = activities.map(a => {
      const log = (a.log || []).find(l => l.date === today);
      const done = log?.status === 'done' || log?.status === 'double';
      const wird = computeTodayWird(a, today);
      const label = TYPES[a.type]?.label || 'نشاط';
      const icon = ICONS[a.type] || '';
      const isRest = wird.status === 'rest';
      const isPaused = wird.status === 'paused' || wird.status === 'finished';

      return `
        <div class="today-item ${isRest ? 'rest' : ''} ${isPaused ? 'paused' : ''}" data-id="${escapeHtml(a.id)}">
          <span class="today-item-icon ${done ? 'done' : ''}">
            <svg viewBox="0 0 24 24">${done ? '<path d="M20 6L9 17l-5-5"/>' : icon}</svg>
          </span>
          <span class="today-item-text">
            <span class="today-item-label">${escapeHtml(label)} · ${escapeHtml(a.name || '')}</span>
            <span class="today-item-value">${escapeHtml(wird.label || '—')}</span>
          </span>
          <button class="today-item-check ${done ? 'checked' : ''}"
                  data-action="toggle-today" data-id="${escapeHtml(a.id)}"
                  aria-label="${done ? 'إلغاء الإنجاز' : 'تسجيل الإنجاز'}" type="button"
                  ${(isRest || isPaused) ? 'disabled style="opacity:.35;cursor:not-allowed"' : ''}>
            <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
        </div>
      `;
    });

    todayBody.innerHTML = `
      <div class="today-items-wrap">
        <div class="today-items${animate ? ' anim' : ''}">${rows.join('')}</div>
      </div>
    `;

    todayBody.querySelectorAll('[data-action="toggle-today"]:not([disabled])').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleTodayDone(btn.dataset.id);
      });
    });

    requestAnimationFrame(() => {
      const wrapEl = todayBody.querySelector('.today-items-wrap');
      const itemsEl = todayBody.querySelector('.today-items');
      if (!wrapEl || !itemsEl) return;
      const hasOverflow = itemsEl.scrollHeight > itemsEl.clientHeight + 2;
      wrapEl.classList.toggle('has-scroll', hasOverflow);
    });
  }

  function toggleTodayDone(id){
    const activity = Storage.getActivity(id);
    if (!activity) return;
    const today = todayKey();
    activity.log = activity.log || [];
    const i = activity.log.findIndex(l => l.date === today);

    if (i >= 0 && (activity.log[i].status === 'done' || activity.log[i].status === 'double')){
      activity.log.splice(i, 1);
      toast('تم إلغاء إنجاز اليوم');
    } else {
      if (i >= 0){
        activity.log[i].status = 'done';
        activity.log[i].markedAt = Date.now();
      } else {
        activity.log.push({ date: today, status: 'done', markedAt: Date.now() });
      }
      toast('أحسنت! ✓');
      if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
      if (isTelegram && tg.HapticFeedback){
        try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
      }
    }
    Storage.upsertActivity(activity);
    renderTodayCard(false);
    renderActivitiesList(false);
    if (currentScreen === 'details') renderDetails(activity.id, false);
  }

  function renderActivitiesList(animate){
    const section = $('activitiesSection');
    const activities = Storage.getActivities().filter(a => !a.archived);

    if (activities.length === 0){
      section.innerHTML = `

          <button class="empty-board-cta" id="emptyAddBtn" type="button">

            <span>أضف نشاطك الأول</span>
          </button>

    const cards = activities.map(a => renderActivityCard(a)).join('');

  function renderActivityCard(a){
    const typeInfo = TYPES[a.type] || { label:'نشاط' };
    const icon = ICONS[a.type] || '';
    const progress = computeProgress(a);
    const sub = describeActivity(a);
    const dayNum = computeDayNumber(a);
    const isPaused = a.status === 'paused';
    const isFinished = a.status === 'finished';

    const statusBadge = isPaused
      ? '<span class="status-badge">موقوف</span>'
      : isFinished
        ? '<span class="status-badge" style="background:var(--md-success)">مكتمل</span>'
        : '';

    let sub2 = sub;
    if (dayNum && !isFinished){
      sub2 += ` · اليوم ${dayNum.current} من ${dayNum.total}`;
    }

    return `
      <article class="activity-card ${isPaused ? 'paused' : ''}" data-id="${escapeHtml(a.id)}" data-type="${escapeHtml(a.type)}" role="button" tabindex="0">
        <header class="activity-head">
          <span class="activity-icon"><svg viewBox="0 0 24 24">${icon}</svg></span>
          <span class="activity-info">
            <span class="activity-name">${escapeHtml(a.name || typeInfo.label)}${statusBadge}</span>
            <span class="activity-sub">${escapeHtml(sub2)}</span>
          </span>
          <svg class="activity-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </header>
        <div class="progress-track">
          <div class="progress-fill" style="width:${progress.percent}%"></div>
        </div>
        <div class="progress-info">
          <span>${escapeHtml(progress.label)}</span>
          <span class="progress-pct">${progress.percent}%</span>
        </div>
      </article>
    `;
  }

  function describeActivity(a){
    if (a.type === 'hifz' || a.type === 'review'){
      const u = UNIT_OPTIONS[a.config?.unit] || '';
      return `من ${a.config?.from ?? '—'} إلى ${a.config?.to ?? '—'} ${u} · ${a.pace?.unitsPerDay ?? '—'} يوميًا`;
    }
    if (a.type === 'reading'){
      if (a.config?.mode === 'khatma') return `ختمة في ${a.config?.durationDays || '—'} يوم`;
      return `${a.config?.amount || '—'} ${UNIT_OPTIONS[a.config?.unit] || ''} يوميًا`;
    }
    if (a.type === 'listening'){
      return a.config?.source ? `من: ${a.config.source}` : 'استماع يومي';
    }
    if (a.type === 'track') return 'تتبّع حر';
    return 'نشاط';
  }

  /* ═══════ اختيار النوع ═══════ */
  $('pickBack').addEventListener('click', goBack);
  document.querySelectorAll('.type-card').forEach(card => {
    card.addEventListener('click', () => openForm(card.dataset.type, null));

  /* ═══════ النموذج ═══════ */
  let formCtx = { type: null, editId: null };

  const TEMPLATES = {
    hifz: [
      { label:'جزء تبارك', apply: (cfg) => { cfg.name='حفظ جزء تبارك'; cfg.unit='page'; cfg.from=562; cfg.to=590; cfg.perDay=2; } },

  function openForm(type, editId){

      templatesSection.querySelectorAll('.template-chip').forEach(btn => {

  function applyTemplate(type, idx){
    const tpl = TEMPLATES[type]?.[idx];
    if (!tpl) return;
    const cfg = {};
    tpl.apply(cfg);

    if (cfg.name) $('formName').value = cfg.name;
    if (type === 'hifz' || type === 'review'){
      if (cfg.unit) $('formUnit').value = cfg.unit;
      if (cfg.from != null) $('formFrom').value = cfg.from;
      if (cfg.to != null) $('formTo').value = cfg.to;
      if (cfg.perDay != null) $('formPerDay').value = cfg.perDay;

    if (type === 'reading'){
      if (cfg.mode) setReadingMode(cfg.mode);
      if (cfg.unit) $('formUnitR').value = cfg.unit;
      if (cfg.amount != null) $('formAmount').value = cfg.amount;
      if (cfg.durationDays != null) $('formDuration').value = cfg.durationDays;

  function renderForm(existing){
    const type = formCtx.type;
    const formBody = $('formBody');
    const defaultStart = todayKey();
    const defaultActive = existing?.pace?.activeDays || [0,1,2,3,4,6];

    let html_ = `
      <div class="form-card">

    if (type === 'hifz' || type === 'review'){
      const cfg = existing?.config || {};
      html_ += `
        <div class="form-section">

  function saveForm(){
    const type = formCtx.type;
    const editId = formCtx.editId;
    const name = ($('formName')?.value || '').trim();
    if (!name){ toast('اكتب اسمًا للنشاط'); return; }

    const existing = editId ? Storage.getActivity(editId) : null;
    const activity = {
      id: editId || uid(),
      type,
      name,
      createdAt: existing?.createdAt || Date.now(),
      archived: existing?.archived || false,
      status: existing?.status || 'active',
      config: {},
      pace: {},
      log: existing?.log || []
    };

    if (type === 'hifz' || type === 'review'){
      const unit = $('formUnit').value;
      const from = parseInt($('formFrom').value, 10) || 1;
      const to   = parseInt($('formTo').value, 10) || 1;
      const perDay = parseFloat($('formPerDay').value) || 1;
      if (to < from){ toast('"إلى" يجب أن يكون أكبر من أو يساوي "من"'); return; }
      activity.config = { unit, from, to };
      activity.pace.unitsPerDay = perDay;
    }

    if (type === 'reading'){
      const mode = document.querySelector('input[name="readingMode"]:checked')?.value || 'daily';
      if (mode === 'daily'){
        activity.config = {
          mode: 'daily',
          unit: $('formUnitR').value,
          amount: parseFloat($('formAmount').value) || 1
        };
      } else {
        activity.config = {
          mode: 'khatma',
          durationDays: parseInt($('formDuration').value, 10) || 30
        };
      }
    }

    if (type === 'listening'){
      activity.config = {
        source: ($('formSource')?.value || '').trim(),
        amount: parseInt($('formListenAmount').value, 10) || 20
      };
    }

    if (type === 'track'){ activity.config = {}; }

    if (type !== 'track'){
      const activeDays = [];
      document.querySelectorAll('.weekday.active').forEach(b => activeDays.push(Number(b.dataset.day)));
      if (activeDays.length === 0){ toast('اختر يومًا واحدًا على الأقل'); return; }
      activity.pace.activeDays = activeDays.sort();
      activity.pace.startDate = $('formStartDate').value || todayKey();
    }

    Storage.upsertActivity(activity);
    toast(editId ? 'تم حفظ التعديلات ✓' : 'أُضيف النشاط ✓');
    if (navigator.vibrate) navigator.vibrate(12);

    formCtx = { type: null, editId: null };
    historyStack.length = 0;
    renderBoard();
    showScreen('board', { skipHistory: true });
  }

  function renderDetails(id, animate){

      renderCalendar(a);

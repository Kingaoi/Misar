  function renderWeekStrip(a){
    const activeDays = a.pace?.activeDays || [0,1,2,3,4,5,6];
    const today = new Date();
    const stripDays = [];
    for (let i = 6; i >= 0; i--){
      const d = addDays(today, -i);
      const k = dateKey(d);
      const dow = d.getDay();
      const isActive = activeDays.includes(dow);
      const status = computeDayStatus(a, k);
      const isToday = k === dateKey(today);

      let cls = 'week-strip-cell';
      if (status === 'done') cls += ' done';
      else if (status === 'double') cls += ' double';
      else if (status === 'skipped') cls += ' skipped';
      else if (status === 'partial') cls += ' partial';
      else if (!isActive) cls += ' rest';
      else if (k < dateKey(today)) cls += ' missed';
      if (isToday) cls += ' today';

      stripDays.push(`
        <div class="week-strip-day">
          <span class="week-strip-dow">${WEEKDAYS_SHORT[dow]}</span>
          <span class="${cls}">${d.getDate()}</span>
        </div>
      `);
    }
    return `<div class="week-strip">${stripDays.join('')}</div>`;
  }

  function renderCalendar(a){
    const titleEl = $('calTitle');
    const gridEl = $('calGrid');
    if (!titleEl || !gridEl) return;

    const year = calendarCursor.getFullYear();
    const month = calendarCursor.getMonth();
    titleEl.textContent = `${MONTHS_AR[month]} ${year}`;

    const firstDay = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startDow = firstDay.getDay();

    const activeDays = a.pace?.activeDays || [0,1,2,3,4,5,6];
    const logMap = {};
    (a.log || []).forEach(l => { logMap[l.date] = l; });

    const todayK = todayKey();
    let html_ = '';
    WEEKDAYS_SHORT.forEach(w => { html_ += `<div class="calendar-dow">${w}</div>`; });

    for (let i = 0; i < startDow; i++){
      html_ += `<div class="calendar-day empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++){
      const dt = new Date(year, month, d);
      const k = dateKey(dt);
      const isActive = activeDays.includes(dt.getDay());
      const entry = logMap[k];
      const status = entry?.status;
      const hasNote = entry?.note && entry.note.length > 0;

      let cls = 'calendar-day';
      if (!isActive) cls += ' rest';
      else if (status === 'done') cls += ' done';
      else if (status === 'double') cls += ' double';
      else if (status === 'partial') cls += ' partial';
      else if (status === 'skipped') cls += ' skipped';
      else if (k < todayK) cls += ' missed';
      if (hasNote) cls += ' has-note';
      if (k === todayK) cls += ' today';

      html_ += `<div class="${cls}" data-date="${k}">${d}</div>`;
    }
    gridEl.innerHTML = html_;

    gridEl.querySelectorAll('.calendar-day[data-date]').forEach(cell => {
      cell.addEventListener('click', () => {
        openDayEditor(a.id, cell.dataset.date);
      });
    });
  }

  function renderLog(a){
    const logList = $('logList');
    if (!logList) return;
    const sorted = (a.log || []).slice().sort((x, y) => y.date.localeCompare(x.date));
    if (sorted.length === 0){
      logList.innerHTML = `<div class="empty-log">لا يوجد سجل بعد — سيظهر هنا كل يوم تسجّله</div>`;
      return;
    }
    logList.innerHTML = sorted.map(l => {
      const info = STATUS_LABELS[l.status] || { label: l.status };
      return `
        <div class="log-item" data-date="${escapeHtml(l.date)}">
          <span class="log-date">${escapeHtml(l.date)}</span>
          <span class="log-status ${escapeHtml(l.status)}">${escapeHtml(info.label)}</span>
          ${l.note ? `<span class="log-note">${escapeHtml(l.note)}</span>` : ''}
        </div>
      `;
    }).join('');

    logList.querySelectorAll('.log-item').forEach(item => {
      item.addEventListener('click', () => {
        openDayEditor(a.id, item.dataset.date);
      });
    });
  }

  function openDayEditor(activityId, dateK){
    const a = Storage.getActivity(activityId);
    if (!a) return;
    const existing = (a.log || []).find(l => l.date === dateK);
    const currentStatus = existing?.status || null;
    const currentNote = existing?.note || '';

    const sheetEl = $('sheet');
    const sheetTitleEl = $('sheetTitle');
    const sheetSubEl = $('sheetSub');
    const sheetBodyEl = $('sheetBody');

    sheetTitleEl.textContent = `يوم ${dateK}`;
    sheetSubEl.hidden = false;
    sheetSubEl.textContent = formatDate(dateK);

    const options = [
      { key:'done',    icon:'<path d="M20 6L9 17l-5-5"/>',                                                       label:'مُنجز',     desc:'أكملت الورد كاملًا' },
      { key:'double',  icon:'<path d="M2 12l5 5L17 7"/><path d="M9 12l5 5L22 7"/>',                              label:'مضاعف',    desc:'أنجزت ضعف الورد' },
      { key:'partial', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18" fill="currentColor"/>',           label:'جزئي',      desc:'أنجزت نصف الورد' },
      { key:'skipped', icon:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',                                label:'تخطّي',     desc:'يوم راحة / عذر' },
    ];

    const optionsHtml = options.map(o => `
      <button class="day-option ${currentStatus === o.key ? 'selected' : ''}" data-status="${o.key}" type="button">
        <svg viewBox="0 0 24 24">${o.icon}</svg>
        <span class="day-option-text">
          <span class="day-option-label">${o.label}</span>
          <span class="day-option-desc">${o.desc}</span>
        </span>
      </button>
    `).join('');

    sheetBodyEl.innerHTML = `
      <div class="day-options">${optionsHtml}</div>
      <div class="form-section" style="margin-top:8px">
        <label class="field-label" for="dayNoteInput">ملاحظة (اختياري)</label>
        <textarea id="dayNoteInput" class="field-textarea" rows="2" maxlength="200" placeholder="مثال: كان صعبًا، قرأت في المسجد...">${escapeHtml(currentNote)}</textarea>
      </div>
      <div class="form-actions" style="margin-top:12px">
        <button class="ghost-btn" id="dayCancel" type="button">إلغاء</button>
        ${existing ? `<button class="danger-btn" id="dayDelete" type="button"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zM9 7V4h6v3"/></svg>حذف اليوم</button>` : ''}
        <button class="primary-btn" id="daySave" type="button"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>حفظ</button>
      </div>
    `;

    $('sheetBackdrop').classList.add('open');
    sheetEl.classList.add('open');

    let selectedStatus = currentStatus;

    sheetBodyEl.querySelectorAll('.day-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = btn.dataset.status;
        selectedStatus = (selectedStatus === s) ? null : s;
        sheetBodyEl.querySelectorAll('.day-option').forEach(b => {
          b.classList.toggle('selected', b.dataset.status === selectedStatus);
        });
      });
    });

    $('dayCancel').addEventListener('click', closeSheet);

    if ($('dayDelete')){
      $('dayDelete').addEventListener('click', () => {
        a.log = (a.log || []).filter(l => l.date !== dateK);
        Storage.upsertActivity(a);
        closeSheet();
        toast('تم حذف اليوم');
        renderDetails(activityId, false);
        renderBoard();
      });
    }

    $('daySave').addEventListener('click', () => {
      const note = ($('dayNoteInput')?.value || '').trim();
      a.log = a.log || [];
      const idx = a.log.findIndex(l => l.date === dateK);

      if (!selectedStatus && !note){
        if (idx >= 0) a.log.splice(idx, 1);
      } else if (!selectedStatus && note){
        if (idx >= 0){
          a.log[idx].note = note;
        } else {
          toast('اختر حالة أولًا');
          return;
        }
      } else {
        if (idx >= 0){
          a.log[idx].status = selectedStatus;
          a.log[idx].note = note;
          a.log[idx].markedAt = Date.now();
        } else {
          a.log.push({ date: dateK, status: selectedStatus, note, markedAt: Date.now() });
        }
      }
      Storage.upsertActivity(a);
      closeSheet();
      toast('تم الحفظ ✓');
      renderDetails(activityId, false);
      renderBoard();
    });
  }

  function handleOption(opt, activity){
    if (opt === 'edit'){ openForm(activity.type, activity.id); return; }

    if (opt === 'pause'){
      const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
      activity.status = 'paused';
      activity.pausedAt = Date.now();
      activity.daysElapsedAtPause = countActiveDaysBetween(activity.pace.startDate, todayKey(), activeDays);
      Storage.upsertActivity(activity);
      toast('تم الإيقاف المؤقت');
      renderDetails(activity.id, false);
      renderBoard();
      return;
    }

    if (opt === 'resume'){
      const activeDays = activity.pace?.activeDays || [0,1,2,3,4,5,6];
      const daysElapsed = activity.daysElapsedAtPause || 0;
      activity.pace.startDate = findStartDate(daysElapsed, activeDays);
      activity.status = 'active';
      delete activity.pausedAt;
      delete activity.daysElapsedAtPause;
      Storage.upsertActivity(activity);
      toast('تم الاستئناف ✓');
      renderDetails(activity.id, false);
      renderBoard();
      return;
    }

    if (opt === 'finish'){
      if (!confirm('إنهاء الخطة الآن؟')) return;
      activity.status = 'finished';
      activity.finishedAt = Date.now();
      Storage.upsertActivity(activity);
      toast('تم إنهاء الخطة');
      detailsActivityId = null;
      renderBoard();
      showScreen('board', { skipHistory: true });
      return;
    }

    if (opt === 'reopen'){
      activity.status = 'active';
      delete activity.finishedAt;
      Storage.upsertActivity(activity);
      toast('تم إعادة فتح الخطة');
      renderDetails(activity.id, false);
      renderBoard();
      return;
    }

    if (opt === 'archive'){
      activity.archived = !activity.archived;
      Storage.upsertActivity(activity);
      toast(activity.archived ? 'تمت الأرشفة' : 'تم إلغاء الأرشفة');
      detailsActivityId = null;
      renderBoard();
      showScreen('board', { skipHistory: true });
      return;
    }

    if (opt === 'reset'){
      if (!confirm('إعادة تعيين الخطة؟ سيُحذف كل السجل ولا يمكن التراجع.')) return;
      activity.log = [];
      activity.status = 'active';
      delete activity.finishedAt;
      delete activity.pausedAt;
      delete activity.daysElapsedAtPause;
      Storage.upsertActivity(activity);
      toast('تم إعادة التعيين');
      renderDetails(activity.id, false);
      renderBoard();
      return;
    }

    if (opt === 'delete'){
      if (!confirm('حذف هذا النشاط نهائيًا؟')) return;
      Storage.deleteActivity(activity.id);
      detailsActivityId = null;
      toast('تم الحذف');
      renderBoard();
      showScreen('board', { skipHistory: true });
      return;
    }
  }

  function exportData(){
    const data = {
      app: 'misar',
      version: 1,
      exportedAt: Date.now(),
      profile: Storage.getProfile(),
      activities: Storage.getActivities()
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `misar-backup-${dateKey()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('تم تصدير النسخة ✓');
  }

  function scheduleNotification(){
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (window._misarNotifTimer) clearTimeout(window._misarNotifTimer);

    const timeStr = localStorage.getItem('misar-notif-time') || '20:00';
    const [h, m] = timeStr.split(':').map(Number);
    const now = new Date();
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);

    const delay = target - now;
    if (delay > 0 && delay < 24 * 60 * 60 * 1000){
      window._misarNotifTimer = setTimeout(() => {
        try {
          new Notification('مِسار', { body: 'حان وقت وردك اليومي 🌿' });
        } catch(e){}
        scheduleNotification();
      }, delay);
    }
  }

  function renderStats(){
    const activities = Storage.getActivities();
    const activeActivities = activities.filter(a => !a.archived);
    const totalDone = activities.reduce((sum, a) => {
      return sum + (a.log || []).filter(l => l.status === 'done' || l.status === 'double').length;
    }, 0);

    let bestStreak = 0;
    let currentStreakSum = 0;
    activities.forEach(a => {
      const s = computeStreak(a);
      if (s.best > bestStreak) bestStreak = s.best;
      if (s.current > currentStreakSum) currentStreakSum = s.current;
    });

    const body = $('statsBody');
    body.innerHTML = `
      <div class="stats-hero">
        <div class="stat-box">
          <span class="stat-value">${totalDone}</span>
          <span class="stat-label">إجمالي أيام منجزة</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">${activeActivities.length}</span>
          <span class="stat-label">أنشطة نشطة</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">${bestStreak}🔥</span>
          <span class="stat-label">أفضل سلسلة</span>
        </div>
        <div class="stat-box">
          <span class="stat-value">${currentStreakSum}🔥</span>
          <span class="stat-label">أطول سلسلة نشطة</span>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">آخر 30 يومًا — كل الأنشطة</div>
        ${renderGlobalChart(activities)}
      </div>
    `;

  function renderGlobalChart(activities){
    const days = 30;
    const today = new Date();
    const data = [];
    for (let i = days - 1; i >= 0; i--){
      const d = addDays(today, -i);
      const k = dateKey(d);
      let doneCount = 0;
      let totalActive = 0;
      activities.forEach(a => {
        if (a.archived) return;
        const activeDays = a.pace?.activeDays || [0,1,2,3,4,5,6];
        if (!activeDays.includes(d.getDay())) return;
        totalActive++;
        const entry = (a.log || []).find(l => l.date === k);
        if (entry && (entry.status === 'done' || entry.status === 'double')) doneCount++;
      });
      data.push({ date: k, done: doneCount, total: totalActive, isToday: i === 0 });
    }

    const chartHeight = 100;
    const chartWidth = 300;
    const barWidth = chartWidth / days - 2;
    let svg = `<svg viewBox="0 0 ${chartWidth} ${chartHeight}" class="chart-svg" preserveAspectRatio="none">`;
    data.forEach((d, i) => {
      const ratio = d.total > 0 ? d.done / d.total : 0;
      const h = ratio * chartHeight;
      const x = i * (chartWidth / days);
      const y = chartHeight - h;
      const cls = d.done === 0 ? 'zero' : (d.done === d.total ? 'full' : 'some');
      const todayCls = d.isToday ? ' today' : '';
      svg += `<rect class="chart-bar ${cls}${todayCls}" x="${x}" y="${y}" width="${barWidth}" height="${h || 2}" rx="1"/>`;
    });
    svg += `</svg>`;
    return svg;
  }

  /* ═══════ FAB ═══════ */
  addFab.addEventListener('click', () => showScreen('pickType'));

  /* ═══════ اختصارات لوحة المفاتيح ═══════ */
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === 'Escape'){
      if (sheet.classList.contains('open')) { closeSheet(); return; }
      if (themePopover.classList.contains('open')) { closePopover(); return; }
      if (currentScreen !== 'board' && currentScreen !== 'welcome'){
        goBack();
      }
      return;
    }

    if (currentScreen !== 'board') return;
    if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); showScreen('pickType'); }
    if (e.key === 's' || e.key === 'S'){ e.preventDefault(); renderSettings(); showScreen('settings'); }
  });

  /* ═══════ الإقلاع ═══════ */
  let savedTheme = 'auto';
  try { savedTheme = localStorage.getItem('misar-theme') || 'auto'; } catch(e){}
  applyTheme(savedTheme);

  if ('Notification' in window && Notification.permission === 'granted'){
    scheduleNotification();
  }

  const profile = Storage.getProfile();
  if (profile && profile.name){
    renderBoard();
    showScreen('board', { skipHistory: true });
  } else {
    // ملء الاسم من Telegram إن وُجد
    if (tgUser && tgUser.first_name){
      nameInput.value = tgUser.first_name;
      welcomeBtn.disabled = false;
    }
    showScreen('welcome', { skipHistory: true });
    setTimeout(() => {
      if (!nameInput.value) nameInput.focus();
    }, 260);
  }
})();
</script>
</body>
</html>
